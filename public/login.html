<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập / Đăng ký - VocabDaily</title>
    <meta name="description" content="Đăng nhập hoặc đăng ký tài khoản VocabDaily để theo dõi từ vựng tiếng Anh mỗi ngày.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <!-- Animated Background -->
    <div class="bg-animation">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <div class="auth-container">
        <div class="auth-card">
            <!-- Header -->
            <div class="auth-header">
                <div class="logo">
                    <i class="fa-solid fa-book-bookmark"></i>
                </div>
                <h1 id="auth-title">Chào mừng trở lại</h1>
                <p id="auth-subtitle">Đăng nhập để tiếp tục học từ vựng</p>
            </div>

            <!-- Messages Area -->
            <div id="message-area" class="message-area hidden"></div>

            <!-- Form -->
            <form id="auth-form" novalidate>
                <!-- Username (Register only) -->
                <div class="input-group hidden" id="username-group">
                    <div class="input-wrapper">
                        <i class="fa-solid fa-user input-icon"></i>
                        <input type="text" id="username" name="username" placeholder="Tên người dùng" minlength="3">
                    </div>
                    <span class="error-text">Tên phải có ít nhất 3 ký tự</span>
                </div>

                <!-- Email -->
                <div class="input-group">
                    <div class="input-wrapper">
                        <i class="fa-solid fa-envelope input-icon"></i>
                        <input type="email" id="email" name="email" placeholder="Địa chỉ Email" required>
                    </div>
                    <span class="error-text">Email không hợp lệ</span>
                </div>

                <!-- Password -->
                <div class="input-group">
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="password" name="password" placeholder="Mật khẩu" required minlength="6">
                        <i class="fa-solid fa-eye-slash password-toggle" id="toggle-password"></i>
                    </div>
                    <span class="error-text">Mật khẩu phải có ít nhất 6 ký tự</span>
                </div>

                <!-- Confirm Password (Register only) -->
                <div class="input-group hidden" id="confirm-password-group">
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="confirm-password" name="confirm-password" placeholder="Xác nhận mật khẩu">
                        <i class="fa-solid fa-eye-slash password-toggle" id="toggle-confirm-password"></i>
                    </div>
                    <span class="error-text">Mật khẩu không khớp</span>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="submit-btn" class="btn-primary">
                    <span class="btn-text">Đăng nhập</span>
                    <i class="fa-solid fa-circle-notch fa-spin btn-spinner hidden"></i>
                </button>
            </form>

            <!-- Toggle Link -->
            <div class="auth-footer">
                <p>
                    <span id="toggle-text">Chưa có tài khoản?</span>
                    <a href="#" id="toggle-mode-link">Đăng ký</a>
                </p>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
